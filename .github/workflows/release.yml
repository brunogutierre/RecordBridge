name: Release

# Pushing a tag like v0.1.0 builds, tests and publishes that version: the libraries and the Maven
# plugin to Maven Central (signed by JReleaser), then the Gradle plugin to the Plugin Portal.
# Each destination is its own job, so "Re-run failed jobs" retries only the one that failed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  maven-central:
    runs-on: ubuntu-latest
    # JReleaser waits up to an hour for the Central Portal to publish the deployment.
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether Maven Central already has this version
        id: central
        run: |
          # Central rejects a second upload of a version, so a full re-run must skip the deploy.
          pom="https://repo1.maven.org/maven2/io/github/brunogutierre/recordbridge/recordbridge-maven-plugin/${{ steps.version.outputs.version }}/recordbridge-maven-plugin-${{ steps.version.outputs.version }}.pom"
          if curl -sfI "$pom" > /dev/null; then
            echo "::notice::${{ steps.version.outputs.version }} is already on Maven Central; skipping the deploy"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.central.outputs.published != 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        if: steps.central.outputs.published != 'true'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.central.outputs.published != 'true'

      - name: Cache what the Maven plugin tests download
        if: steps.central.outputs.published != 'true'
        uses: actions/cache@v6
        with:
          # The functional tests run a real Maven build. Reusing its downloads avoids Maven
          # Central's rate limit (HTTP 429) on shared runners. RecordBridge's own snapshots
          # are left out: every build publishes them again.
          path: |
            build/maven-local-repo
            !build/maven-local-repo/io/github/brunogutierre
          key: maven-tests-${{ hashFiles('gradle/libs.versions.toml', 'maven-plugin/src/test/**') }}
          restore-keys: maven-tests-

      - name: Build, test and stage the artifacts
        if: steps.central.outputs.published != 'true'
        run: ./gradlew build publishAllPublicationsToStagingRepository -Pversion=${{ steps.version.outputs.version }}

      - name: Sign and deploy to Maven Central
        if: steps.central.outputs.published != 'true'
        uses: jreleaser/release-action@v2
        with:
          version: 1.27.0
          arguments: deploy
          setup-java: false
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Keep the JReleaser logs
        if: always() && steps.central.outputs.published != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-logs
          path: out/jreleaser/
          retention-days: 14

  gradle-plugin:
    # The plugin's POM depends on recordbridge-generator, which must be on Maven Central first.
    needs: maven-central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish the Gradle plugin
        run: ./gradlew :gradle-plugin:publishPlugins -Pversion=${{ needs.maven-central.outputs.version }}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
