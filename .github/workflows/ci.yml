name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Cache what the Maven plugin tests download
        uses: actions/cache@v6
        with:
          # The functional tests run a real Maven build. Reusing its downloads avoids Maven
          # Central's rate limit (HTTP 429) on shared runners. RecordBridge's own snapshots
          # are left out: every build publishes them again.
          path: |
            build/maven-local-repo
            !build/maven-local-repo/io/github/brunogutierre
          key: maven-tests-${{ hashFiles('gradle/libs.versions.toml', 'maven-plugin/src/test/**') }}
          restore-keys: maven-tests-

      - name: Build and test
        run: ./gradlew build

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Type-check and test generated TypeScript (golden files)
        run: |
          npm ci
          npm run check:ts
          npm run test:ts

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/'
          if-no-files-found: ignore

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/spring-angular/web/package-lock.json

      - name: Generated API is up to date
        run: |
          ./gradlew -p examples/spring-angular generateTypeScript
          git diff --exit-code examples/spring-angular/web/src/app/api

      - name: Build the Angular app and run the end-to-end tests
        working-directory: examples/spring-angular/web
        run: |
          npm ci
          npx ng build
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: examples/spring-angular/web/test-results/
          if-no-files-found: ignore
