[versions]
assertj = "3.27.7"
jackson = "3.1.7"
maven = "3.9.16"
jspecify = "1.0.1"
reactor = "3.8.8"
junit = "6.1.3"
spotless = "8.11.0"
spring = "7.0.10"

[libraries]
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
reactor-core = { module = "io.projectreactor:reactor-core", version.ref = "reactor" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
spring-webmvc = { module = "org.springframework:spring-webmvc", version.ref = "spring" }
spring-web = { module = "org.springframework:spring-web", version.ref = "spring" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
